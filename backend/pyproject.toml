[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501", # line length handled gracefully
    "B008", # do not perform function call in argument defaults (FastAPI Depends idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

